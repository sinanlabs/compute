# 复制到你仓库的 .github/workflows/sinan-price-watch.yml。每天北京时间 10 点检查一次，有变动就开一个 Issue。
name: Sinan price watch
on:
  schedule: [{ cron: "0 2 * * *" }]
  workflow_dispatch:
permissions: { contents: write, issues: write }
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: curl -sO https://raw.githubusercontent.com/sinanlabs/compute/main/templates/github-action/sinan_watch.py
      - id: w
        env:
          SINAN_MODELS: gpt-5.6-luna,claude-sonnet-5,deepseek-v4-pro   # 改成你关注的模型 id
          SINAN_THRESHOLD: "5"
        run: |
          python3 sinan_watch.py > report.md || true
          echo "changed=$(grep -c '^| ' report.md || true)" >> "$GITHUB_OUTPUT"
      - run: |
          git config user.name sinan-watch && git config user.email actions@users.noreply.github.com
          git add .sinan_state.json && git commit -m "sinan-watch: state" && git push || true
      - if: steps.w.outputs.changed != '0'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh issue create --title "中转市场价格变动 · $(date -u +%F)" --body-file report.md
