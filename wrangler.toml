# Sinan Compute · Cloudflare Pages 配置（wrangler 直传）
# 密钥（GITHUB_CLIENT_SECRET、SESSION_SECRET）只放在 Cloudflare 面板的 Secrets 里，不进仓库。
name = "sinan-compute"
pages_build_output_dir = "site/dist"
compatibility_date = "2025-06-01"

[[d1_databases]]
binding = "DB"
database_name = "sinan-users"
database_id = "4109f1ab-5f52-43c8-bee8-90664cd14af6"

[[kv_namespaces]]
binding = "KV"
id = "01d14fee71b2465d906fdccbf4eac4bb"

[vars]
# GitHub OAuth App 的 Client ID（非密钥）。Eric 建好应用后填入。
GITHUB_CLIENT_ID = "Ov23liyyjBUluoOWdC81"
COOKIE_DOMAIN = ".sinanlab.com"
SITE_ORIGIN = "https://compute.sinanlab.com"
# Google 登录：Google Cloud 控制台建 OAuth 客户端（Web 应用），授权回调 https://compute.sinanlab.com/api/auth/google/callback；
# Client ID 填下面（取消注释），Client Secret 放面板 Secrets：GOOGLE_CLIENT_SECRET。两者齐了登录页自动出现 Google 按钮。
GOOGLE_CLIENT_ID = "511088198110-csbapdb4d1i1p1v0vvn6q671mmbi5nr0.apps.googleusercontent.com"

# 手机号登录（阿里云短信）。四项都配好后 /login 页自动出现"手机"入口：
#   Secrets（面板）：SMS_ACCESS_KEY_ID、SMS_ACCESS_KEY_SECRET
#   vars（下面两行取消注释填入）：签名名称与模板 CODE（模板须含 ${code} 变量）
# SMS_SIGN_NAME = "司南实验室"
# SMS_TEMPLATE_CODE = "SMS_xxxxxxxxx"
